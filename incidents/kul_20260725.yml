meta_data:
  title: KU Leuven Tier-2 whole system reservation 
  start_date: 2026-07-25 16:00:00
  end_date: 
  affected: tier2_leuven
  level: high
  planned: no
content: >

  <p>
  [update 2026-07-27 13:30]  The cooling issues have been resolved. The situation will be monitored closely, especially with the warm weather expected in the coming days. In the meantime, a new system image is being rolled out to the compute nodes. The nodes are expected to be released shortly.
  </p>

  <p>
  [2026-07-25 16:00] Due to a general cooling issue in the data center, some Tier-2 nodes are being proactively shut down. No nodes currently running active jobs have been turned off so far. A reservation has been enabled on the Tier-2 systems, and no new jobs will be scheduled until the situation is resolved.
  </p>
