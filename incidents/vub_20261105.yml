meta_data:
  title: Tier-2 Hydra and Anansi System Update
  start_date: 2026-11-05 00:00:00
  end_date: 2026-11-10 00:00:00
  affected: tier2_brussels
  level: low
  planned: yes
content: >
  <p>
    We are updating the operating system on VUB Tier-2 clusters Hydra and Anansi
    with the latest security and bug fixes.
    <b>Access to these clusters will be unavailable for 15-30 min on Thursday 5th
    November at 02:00 CET.</b> We will reboot the login nodes and the OnDemand
    service of <i>portal.hpc.vub.be</i>, disconnecting any
    active user sessions on those systems.
  </p>
  <p>
    The roll-out of updates to the computes nodes will start on <b>Thursday Nov
    5th</b> and will be progressively carried out in the coming days.
    This operation has a <b>minimal impact</b> on our users: compute capacity will
    be slightly lower during the update, but there will be no downtime of the
    clusters and all job queues will remain operational.
  </p>
