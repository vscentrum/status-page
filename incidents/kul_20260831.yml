meta_data:
  title: Issues with Lustre storage
  start_date: 2026-08-31 12:20:00
  end_date:
  affected: tier2_leuven
  level: high
  planned: no
content: >

  <p>
  [2026-08-31 16:00] The recovery is still ongoing.
  </p>

  <p>
  [2026-08-31 13:00] Faulty storage hardware has been replaced and the Lustre
  filesystem recovery is underway. Most storage components have recovered
  successfully, although one disk group still requires further investigation.
  </p>

  <p>
  [2026-08-31 12:20] Due to issues with the Lustre storage, the wICE cluster has
  been reserved so that no new jobs get to start until further notice.

  Genius and Mindwell remain available (but accessing Lustre storage from
  these clusters may be affected).
  </p>
