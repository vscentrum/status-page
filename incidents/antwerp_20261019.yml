meta_data:
  title: CalcUA Tier-2 access closed
  start_date: 2026-10-19 16:45:00
  end_date: 
  affected: tier2_antwerp
  level: high
  planned: no
content: >

  <p>
  Due to a recently disclosed critical vulnerability, access to the
  CalcUA clusters has been closed.<br/>
  Access to both the login and portal nodes has been disabled.
  </p>
 
  <p>
  No new jobs will be allowed to start until further notice.<br/>
  Users can still access their data on the cluster through Globus.
  </p>

  <p>
  Running jobs are not affected, but new jobs will only start
  after the necessary patches have been applied.<br/>
  Users can still access their data on the cluster through Globus.
  </p>

  <p>We will do what we can to restore access as soon as possible. </p>

  <p>Our apologies for the inconvenience.</p>

