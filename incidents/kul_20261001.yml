meta_data:
  title: V100 GPU nodes unavailable
  start_date: 2026-10-01 13:00:00
  end_date:
  affected: tier2_leuven
  level: low
  planned: no
content: >
  <p>
  [Update 2026-10-06 16:15] Also the wICE P100 nodes are now back in
  production. At this point the two V100 nodes are the main ones that are still
  unavailable.
  </p>

  <p>
  [Update 2026-10-02 15:50] More nodes have been serviced and released,
  now also including wICE H100 and Mindwell B200 and interactive nodes.
  </p>

  <p>
  [Update 2026-10-02 14:05] A first set of wICE A100 and interactive nodes
  have been patched and brought back in production. Other nodes will
  gradually follow over the course of the following days.
  </p>

  <p>
  All compute nodes containing GPU devices have been reserved to perform
  urgent maintenance. No new jobs will therefore be allowed to start on GPU
  or interactive partitions during this period.
  </p>
