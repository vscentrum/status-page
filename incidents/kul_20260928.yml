meta_data:
  title: Tier-2 maintenance
  start_date: 2026-09-28 08:00:00
  end_date:  
  affected: tier2_leuven
  level: high 
  planned: yes
content: >
  <p>
  Both wICE and Mindwell will be unavailable during the maintenance window, several planned maintenance activities will be carried out.

  <ul>
    <li>A maintenance intervention on Lustre is required. During part of this work, the filesystem will need to be taken offline</li>
    <li>The Slurm backend database will be upgraded and optimized to support new functionality introduced in recent Slurm releases and to maintain long-term performance.</li>
    <li>The old Genius P100 and V100 nodes will be migrated to wICE.</li>
  </ul>

  The Lustre maintenance is expected to take the longest. As Lustre serves as the primary scratch filesystem for wICE, the cluster will remain unavailable until Lustre is back online. Mindwell will become available again once the Slurm database maintenance has been completed, but only jobs do not require access to Lustre can be scheduled.
  </p>
