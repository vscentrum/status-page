meta_data:
  title: Tier-2 VUB-HPC - move to Research Park Zellik
  start_date: 2026-09-07 00:00:00
  end_date: 2026-09-14 09:00:00
  affected: tier2_brussels
  level: high
  planned: yes
content: >
  <p>
  Both VUB-HPC clusters Hydra and Anansi will move to the data center in the Research Park Zellik in the week of September 7th.
  The clusters will be fully shutdown on Monday September 7th at midnight and will re-open to users a week later, on Monday September 14th.
  <br>
  Please check the <a href="https://hpc.vub.be/news/2026/hydra-anansi-move/">news page</a> for details and updates.
  </p>
