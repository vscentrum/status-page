meta_data:
  title: Temporary restrictions on Tier-2 user namespaces, impacting containers
  start_date: 2026-10-23 13:00:00
  end_date: 
  affected: tier2_gent
  level: low
  planned: yes
content: >
  <p>
  Temporary restrictions are in place on user namespaces for all UGent Tier-2 systems, for security reasons.
  </p>
  <p>
  This implies that containers in jobs and the apptainer module won't work.
  </p>
