meta_data:
  title: KU Leuven Tier-2 whole system reservations
  start_date: 2026-08-20 10:40:00
  end_date:
  affected: tier2_leuven
  level: high
  planned: no
content: >

  <p>
  [2026-08-20 11:15] To preserve more critical parts of the datacenter, all wICE and Mindwell compute nodes will now be shut down. This unfortunately means that all running jobs will be aborted.
  </p>

  <p>
  [2026-08-20 10:40] Due to a general cooling issue in the data center, a reservation has been placed on all Genius, wICE and Mindwell compute nodes. No new jobs will be scheduled until the situation has stabilized.
  </p>
