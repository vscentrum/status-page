meta_data:
  title: Maintenance to HPC-UGent Tier2 infrastructure
  start_date: 2026-09-14 08:00:00
  end_date: 2026-09-18 18:00:00
  affected: tier2_gent
  level: high
  planned: yes
content: >
  <p>
  Maintenance is scheduled to the HPC-UGent Tier2 infrastructure from Monday 14 (08:00 CET) till Friday 18 September 2026.
  A power outage to the datacenter hosting the Tier2 infrastructure is already scheduled that week.
  We’ll try and take advantage of this to additionally perform necessary maintenance works to Tier2.
  </p>
  <p>
  The entire HPC-UGent Tier2 infrastructure will be offline and unavailable during this period.
  This includes all workernodes as well as login and debug nodes, and the Tier2 shared storage (home, data, scratch).
  </p>
  <p>
  If at all possible, we will limit the effective downtime as much as possible.
  </p>
